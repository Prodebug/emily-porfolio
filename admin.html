<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Админ-панель — Эмили</title>
  <link rel="stylesheet" href="static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    .upload-progress {
      margin-top: 12px;
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
      display: none;
    }
    .upload-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      width: 0%;
      transition: width 0.2s;
    }
    .song-admin-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg);
      border-radius: 10px;
      margin-bottom: 8px;
      gap: 12px;
    }
    .song-admin-item span {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-danger {
      background: #ff4d6a;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-danger:hover { opacity: 0.9; }
    .admin-panel { max-width: 560px; }
  </style>
</head>
<body class="admin-page">
  <div class="bg-gradient"></div>
  <div class="bg-orbs" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>
  <div class="bg-noise" aria-hidden="true"></div>

  <header class="header">
    <div class="container">
      <div class="logo">♪ Эмили</div>
      <nav>
        <a href="index.html" class="nav-link">← На сайт</a>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">

      <!-- LOGIN -->
      <div class="login-card" id="loginCard">
        <h1>Вход для Эмили</h1>
        <p>Введи email и пароль, которые тебе дали</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="emily@example.com" autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-full">Войти</button>
          <p class="error-msg" id="errorMsg" style="display:none;"></p>
        </form>
      </div>

      <!-- ADMIN PANEL -->
      <div class="admin-panel" id="adminPanel" style="display: none;">
        <h1>Админ-панель</h1>
        <p id="welcomeText">Загружай свои песни прямо здесь ❤️</p>

        <!-- Upload form -->
        <form id="uploadForm" style="margin-top: 24px;">
          <div class="form-group">
            <label for="songTitle">Название песни</label>
            <input type="text" id="songTitle" required placeholder="Например: Ночной город" maxlength="80">
          </div>
          <div class="form-group">
            <label for="songFile">Файл (mp3, wav, ogg, m4a)</label>
            <input type="file" id="songFile" accept="audio/*,.mp3,.wav,.ogg,.m4a" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full" id="uploadBtn">Загрузить песню</button>

          <div class="upload-progress" id="progressWrap">
            <div class="upload-progress-bar" id="progressBar"></div>
          </div>
          <p class="success-msg" id="successMsg" style="display:none;"></p>
          <p class="error-msg" id="uploadError" style="display:none;"></p>
        </form>

        <!-- List of songs -->
        <div style="margin-top: 36px;">
          <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Мои песни</h3>
          <div id="adminSongsList">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Загрузка...</p>
          </div>
        </div>

        <div class="admin-actions" style="margin-top: 28px;">
          <a href="index.html" class="btn btn-secondary btn-full">Открыть сайт</a>
          <button type="button" class="btn btn-secondary btn-full" id="logoutBtn">Выйти</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import {
      auth, db,
      signInWithEmailAndPassword, signOut, onAuthStateChanged,
      collection, getDocs, addDoc, deleteDoc, doc, orderBy, query, serverTimestamp
    } from './static/js/firebase-config.js';

    const CLOUDINARY_CLOUD_NAME = 'mjulcvdd';
    const CLOUDINARY_UPLOAD_PRESET = 'emily_portfolio';

    const loginCard = document.getElementById('loginCard');
    const adminPanel = document.getElementById('adminPanel');
    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const uploadForm = document.getElementById('uploadForm');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const successMsg = document.getElementById('successMsg');
    const uploadError = document.getElementById('uploadError');
    const adminSongsList = document.getElementById('adminSongsList');
    const logoutBtn = document.getElementById('logoutBtn');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginCard.style.display = 'none';
        adminPanel.style.display = 'block';
        loadAdminSongs();
      } else {
        loginCard.style.display = 'block';
        adminPanel.style.display = 'none';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        errorMsg.textContent = 'Неверный email или пароль';
        errorMsg.style.display = 'block';
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    function uploadToCloudinary(file, onProgress) {
      return new Promise((resolve, reject) => {
        const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`;
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && onProgress) {
            onProgress((e.loaded / e.total) * 100);
          }
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            const resp = JSON.parse(xhr.responseText);
            resolve(resp.secure_url);
          } else {
            let msg = 'Ошибка загрузки файла';
            try {
              const errResp = JSON.parse(xhr.responseText);
              if (errResp.error && errResp.error.message) msg = errResp.error.message;
            } catch (_) {}
            reject(new Error(msg));
          }
        };

        xhr.onerror = () => reject(new Error('Ошибка сети при загрузке'));
        xhr.send(formData);
      });
    }

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      successMsg.style.display = 'none';
      uploadError.style.display = 'none';

      const title = document.getElementById('songTitle').value.trim();
      const fileInput = document.getElementById('songFile');
      const file = fileInput.files[0];

      if (!file) return;

      if (file.size > 50 * 1024 * 1024) {
        uploadError.textContent = 'Файл слишком большой (максимум 50 МБ)';
        uploadError.style.display = 'block';
        return;
      }

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Загрузка...';
      progressWrap.style.display = 'block';
      progressBar.style.width = '0%';

      try {
        const url = await uploadToCloudinary(file, (pct) => {
          progressBar.style.width = pct + '%';
        });

        await addDoc(collection(db, 'songs'), {
          title: title,
          artist: 'Эмили',
          url: url,
          fileName: file.name,
          duration: '',
          createdAt: serverTimestamp()
        });

        successMsg.textContent = '✅ Песня успешно загружена!';
        successMsg.style.display = 'block';
        uploadForm.reset();
        loadAdminSongs();

      } catch (err) {
        console.error(err);
        uploadError.textContent = 'Ошибка загрузки: ' + (err.message || 'попробуй ещё раз');
        uploadError.style.display = 'block';
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Загрузить песню';
        setTimeout(() => { progressWrap.style.display = 'none'; }, 1500);
      }
    });

    async function loadAdminSongs() {
      try {
        const q = query(collection(db, 'songs'), orderBy('createdAt', 'desc'));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          adminSongsList.innerHTML = '<p style="color:var(--text-muted);font-size:0.9rem;">Пока нет песен</p>';
          return;
        }

        adminSongsList.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const item = document.createElement('div');
          item.className = 'song-admin-item';
          item.innerHTML = `
            <span title="${data.title}">${data.title}</span>
            <button class="btn-danger" data-id="${docSnap.id}">Удалить</button>
          `;
          adminSongsList.appendChild(item);
        });

        adminSongsList.querySelectorAll('.btn-danger').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Удалить эту песню?')) return;
            const id = btn.dataset.id;
            try {
              await deleteDoc(doc(db, 'songs', id));
              loadAdminSongs();
            } catch (err) {
              alert('Не удалось удалить: ' + err.message);
            }
          });
        });
      } catch (err) {
        adminSongsList.innerHTML = 'Ошибка загрузки списка';
      }
    }
  </script>
</body>
</html>
